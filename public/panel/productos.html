<meta charset="UTF-8">

</head>

    <nav class="sidebar-nav">

        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 8l2 -4h12l2 4" /><path d="M4 8h4l2 3h4l2 -3h4" /><path d="M4 8v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1 -1v-9" /></svg>

        <span>Proveedores</span>

      <a href="inventario.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="2" /><path d="M9 4a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v1a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" /><path d="M9 11h6" /><path d="M9 15h6" /></svg>

        <span>Ventas</span>

  <main class="contenido-principal">
    <h1>Productos — Sprint 2</h1>

    <form id="formProducto" onsubmit="return guardarProducto(event)">
      <input type="hidden" id="id_producto">
      <div class="fila-form">
        <label>Nombre
          <input id="nombre" required>
        </label>
        <label>Categoría
          <select id="id_categoria" required></select>
        </label>
        <label>Unidad de medida
          <input id="unidad_medida" placeholder="botella, caja, unidad..." required>
        </label>
      </div>
      <div class="fila-form">
        <label>Precio
          <input id="precio" type="number" min="0.01" step="0.01" required>
        </label>
        <label id="labelStock">Stock inicial
          <input id="stock_actual" type="number" min="0" step="1" value="0">
        </label>
        <label>Umbral de alerta
          <input id="umbral_alerta" type="number" min="0" step="1" value="0">
        </label>
      </div>
      <button type="submit" class="btn btn-primario" id="btnGuardar">Crear producto</button>
      <button type="button" class="btn btn-secundario oculto" id="btnCancelar" onclick="cancelarEdicion()">Cancelar edición</button>
    </form>

    <label class="filtro">
      <input type="checkbox" id="soloAlerta" onchange="cargarProductos()" style="width:auto;">
      Mostrar solo productos en alerta de stock bajo
    </label>

    <table>
      <thead>
        <tr><th>Nombre</th><th>Categoría</th><th>Unidad</th><th>Precio</th><th>Stock</th><th>Umbral</th><th>Acción</th></tr>
      </thead>
      <tbody id="filas"></tbody>
    </table>

    <pre id="resultado"></pre>
  </main>

<script>
  function token() { return localStorage.getItem("token"); }

  function escapeHtml(texto) {
    return String(texto).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  async function cargarCategorias() {
    const res = await fetch("/api/categorias", { headers: { Authorization: `Bearer ${token()}` } });
    const categorias = await res.json();
    const select = document.getElementById("id_categoria");
    select.innerHTML = categorias.map((c) => `<option value="${c.id_categoria}">${escapeHtml(c.nombre)}</option>`).join("");
  }

  // Se cachean los productos cargados para poder rellenar el formulario de
  // edición por id sin tener que serializar el objeto dentro de un onclick
  // (un nombre de producto con comillas rompería el atributo HTML).
  let productosCache = {};

  async function cargarProductos() {
    const soloAlerta = document.getElementById("soloAlerta").checked;
    const url = soloAlerta ? "/api/productos?bajo_stock=true" : "/api/productos";
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token()}` } });
    const productos = await res.json();
    if (!res.ok) {
      document.getElementById("resultado").textContent = JSON.stringify(productos, null, 2);
      return;
    }

    productosCache = {};
    const filas = document.getElementById("filas");
    filas.innerHTML = "";
    for (const p of productos) {
      productosCache[p.id_producto] = p;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${escapeHtml(p.nombre)}${p.alerta_stock_bajo ? '<span class="badge badge-alerta">STOCK BAJO</span>' : ""}</td>
        <td>${escapeHtml(p.categoria_nombre)}</td>
        <td>${escapeHtml(p.unidad_medida)}</td>
        <td>$${Number(p.precio).toFixed(2)}</td>
        <td>${p.stock_actual}</td>
        <td>${p.umbral_alerta}</td>
        <td><button type="button" class="btn" onclick="editarProducto(${p.id_producto})">Editar</button></td>
      `;
      filas.appendChild(tr);
    }
  }

  function editarProducto(id_producto) {
    const p = productosCache[id_producto];
    document.getElementById("id_producto").value = p.id_producto;
    document.getElementById("nombre").value = p.nombre;
    document.getElementById("id_categoria").value = p.id_categoria;
    document.getElementById("unidad_medida").value = p.unidad_medida;
    document.getElementById("precio").value = p.precio;
    document.getElementById("umbral_alerta").value = p.umbral_alerta;

    // El stock solo cambia vía entradas/salidas (US-06/US-07), nunca al editar
    // el producto, así que se muestra el valor actual pero no se envía al guardar.
    document.getElementById("stock_actual").value = p.stock_actual;
    document.getElementById("stock_actual").disabled = true;
    document.getElementById("labelStock").textContent = "Stock actual (editar solo vía entradas/salidas)";

    document.getElementById("btnGuardar").textContent = "Actualizar producto";
    document.getElementById("btnCancelar").classList.remove("oculto");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function cancelarEdicion() {
    document.getElementById("formProducto").reset();
    document.getElementById("id_producto").value = "";
    document.getElementById("stock_actual").disabled = false;
    document.getElementById("labelStock").textContent = "Stock inicial";
    document.getElementById("btnGuardar").textContent = "Crear producto";
    document.getElementById("btnCancelar").classList.add("oculto");
  }

  async function guardarProducto(evento) {
    evento.preventDefault();
    const id_producto = document.getElementById("id_producto").value;

    const cuerpo = {
      nombre: document.getElementById("nombre").value,
      id_categoria: Number(document.getElementById("id_categoria").value),
      unidad_medida: document.getElementById("unidad_medida").value,
      precio: Number(document.getElementById("precio").value),
      umbral_alerta: Number(document.getElementById("umbral_alerta").value),
    };
    if (!id_producto) {
      cuerpo.stock_actual = Number(document.getElementById("stock_actual").value);
    }

    const url = id_producto ? `/api/productos/${id_producto}` : "/api/productos";
    const method = id_producto ? "PUT" : "POST";

    const res = await fetch(url, {
      method,
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token()}` },
      body: JSON.stringify(cuerpo),
    });
    const data = await res.json();
    document.getElementById("resultado").textContent = JSON.stringify(data, null, 2);
    if (res.ok) {
      cancelarEdicion();
      cargarProductos();
    }
  }

  if (!token()) {
    document.body.innerHTML = "<p>Debes iniciar sesión primero en <a href='login.html'>login.html</a>.</p>";
  } else {
    cargarCategorias().then(cargarProductos);
  }
</script>
</body>
</html>
