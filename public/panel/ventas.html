<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Licorería — Ventas</title>
<link rel="stylesheet" href="panel.css">
<style>
  .fila-venta .btn { margin-top: 0; padding: 4px 10px; }
  #totalVenta { font-size: 18px; }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-marca">Licorería</div>
    <nav class="sidebar-nav">
      <a href="login.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 4h6a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-6" /><path d="M3 12h13" /><path d="M13 15l3 -3l-3 -3" /></svg>
        <span>Login</span>
      </a>
      <a href="mesas.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1" /><rect x="14" y="4" width="6" height="6" rx="1" /><rect x="4" y="14" width="6" height="6" rx="1" /><rect x="14" y="14" width="6" height="6" rx="1" /></svg>
        <span>Mesas</span>
      </a>
      <a href="pedidos.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 8l2 -4h12l2 4" /><path d="M4 8h4l2 3h4l2 -3h4" /><path d="M4 8v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1 -1v-9" /></svg>
        <span>Pedidos entrantes</span>
      </a>
      <a href="productos.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9l-8 4.5l-8 -4.5v-9z" /><path d="M12 12l8 -4.5" /><path d="M12 12v9" /><path d="M12 12l-8 -4.5" /></svg>
        <span>Productos</span>
      </a>
      <a href="proveedores.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="9" width="10" height="7" rx="1" /><path d="M13 12h4l3 3v1h-7z" /><circle cx="7" cy="17.5" r="1.5" /><circle cx="17" cy="17.5" r="1.5" /></svg>
        <span>Proveedores</span>
      </a>
      <a href="inventario.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="2" /><path d="M9 4a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v1a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" /><path d="M9 11h6" /><path d="M9 15h6" /></svg>
        <span>Inventario</span>
      </a>
      <a href="ventas.html" class="nav-item activo">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 3h14v18l-3 -2l-2 2l-2 -2l-2 2l-2 -2l-3 2z" /><path d="M8 8h8" /><path d="M8 12h8" /></svg>
        <span>Ventas</span>
      </a>
    </nav>
  </aside>

  <main class="contenido-principal">
    <h1>Ventas — Sprint 4</h1>

    <div id="contenido">
      <div class="tarjetas">
        <div class="tarjeta">
          <div class="numero" id="cardTotalVendido">$0.00</div>
          <div class="etiqueta">Total vendido (filtro actual)</div>
        </div>
        <div class="tarjeta">
          <div class="numero" id="cardCantidadVentas">0</div>
          <div class="etiqueta">Ventas (filtro actual)</div>
        </div>
      </div>

      <div class="seccion">
        <h2>Venta rápida (sin mesa)</h2>
        <div class="fila-form">
          <label>Producto
            <select id="itemProducto"></select>
          </label>
          <label>Cantidad
            <input id="itemCantidad" type="number" min="1" step="1" value="1">
          </label>
        </div>
        <button type="button" class="btn" onclick="agregarLinea()">Agregar línea</button>

        <table>
          <thead>
            <tr><th>Producto</th><th>Cantidad</th><th>Precio unit.</th><th>Subtotal</th><th></th></tr>
          </thead>
          <tbody id="lineasVenta" class="fila-venta"></tbody>
        </table>
        <p>Total: <strong id="totalVenta">$0.00</strong></p>
        <button type="button" class="btn btn-primario" onclick="confirmarVenta()">Confirmar venta</button>
      </div>

      <div class="seccion">
        <h2>Reporte de ventas</h2>
        <form id="formFiltro" onsubmit="return aplicarFiltro(event)">
          <div class="fila-form">
            <label>Desde
              <input id="filtroDesde" type="date">
            </label>
            <label>Hasta
              <input id="filtroHasta" type="date">
            </label>
            <label>Tipo
              <select id="filtroTipo">
                <option value="">Todas</option>
                <option value="mesa">Mesa</option>
                <option value="mostrador">Mostrador</option>
              </select>
            </label>
          </div>
          <button type="submit" class="btn">Filtrar</button>
          <button type="button" class="btn" onclick="exportarCSV()">Exportar CSV</button>
        </form>

        <table>
          <thead>
            <tr><th>Fecha</th><th>Tipo</th><th>Mesa</th><th>Usuario</th><th>Total</th></tr>
          </thead>
          <tbody id="filas"></tbody>
        </table>
      </div>

      <pre id="resultado"></pre>
    </div>
  </main>

<script>
  function token() { return localStorage.getItem("token"); }

  function escapeHtml(texto) {
    return String(texto).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function mostrarPermisoDenegado() {
    document.getElementById("contenido").innerHTML =
      '<p class="error-permiso">No tienes permiso para ver esta sección.</p>';
  }

  let productosCache = {};

  async function cargarProductos() {
    const res = await fetch("/api/productos", { headers: { Authorization: `Bearer ${token()}` } });
    if (res.status === 403) {
      mostrarPermisoDenegado();
      return;
    }
    const productos = await res.json();
    productosCache = {};
    for (const p of productos) productosCache[p.id_producto] = p;
    document.getElementById("itemProducto").innerHTML = productos
      .map((p) => `<option value="${p.id_producto}">${escapeHtml(p.nombre)}</option>`)
      .join("");
  }

  // US-15: líneas de la venta rápida en memoria hasta confirmar; el precio
  // definitivo siempre lo fija el servidor (precio_unitario del producto al
  // momento de la venta), esto solo es una vista previa del total.
  let lineas = [];

  function agregarLinea() {
    const id_producto = Number(document.getElementById("itemProducto").value);
    const cantidad = Number(document.getElementById("itemCantidad").value);
    if (!id_producto || cantidad <= 0) return;

    const producto = productosCache[id_producto];
    const existente = lineas.find((l) => l.id_producto === id_producto);
    if (existente) {
      existente.cantidad += cantidad;
    } else {
      lineas.push({ id_producto, nombre: producto.nombre, precio_unitario: producto.precio, cantidad });
    }
    renderLineas();
  }

  function quitarLinea(id_producto) {
    lineas = lineas.filter((l) => l.id_producto !== id_producto);
    renderLineas();
  }

  function renderLineas() {
    const cuerpo = document.getElementById("lineasVenta");
    cuerpo.innerHTML = "";
    let total = 0;
    for (const l of lineas) {
      const subtotal = l.cantidad * l.precio_unitario;
      total += subtotal;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${escapeHtml(l.nombre)}</td>
        <td>${l.cantidad}</td>
        <td>$${Number(l.precio_unitario).toFixed(2)}</td>
        <td>$${subtotal.toFixed(2)}</td>
        <td><button type="button" class="btn" onclick="quitarLinea(${l.id_producto})">Quitar</button></td>
      `;
      cuerpo.appendChild(tr);
    }
    document.getElementById("totalVenta").textContent = `$${total.toFixed(2)}`;
  }

  async function confirmarVenta() {
    if (lineas.length === 0) return;
    const cuerpo = { items: lineas.map((l) => ({ id_producto: l.id_producto, cantidad: l.cantidad })) };
    const res = await fetch("/api/ventas", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token()}` },
      body: JSON.stringify(cuerpo),
    });
    if (res.status === 403) {
      mostrarPermisoDenegado();
      return;
    }
    const data = await res.json();
    document.getElementById("resultado").textContent = JSON.stringify(data, null, 2);
    if (res.ok) {
      lineas = [];
      renderLineas();
      cargarVentas();
    }
  }

  function parametrosFiltro() {
    const params = new URLSearchParams();
    const desde = document.getElementById("filtroDesde").value;
    const hasta = document.getElementById("filtroHasta").value;
    const tipo = document.getElementById("filtroTipo").value;
    if (desde) params.set("desde", desde);
    if (hasta) params.set("hasta", hasta);
    if (tipo) params.set("tipo", tipo);
    return params;
  }

  function aplicarFiltro(evento) {
    evento.preventDefault();
    cargarVentas();
  }

  async function cargarVentas() {
    const res = await fetch(`/api/ventas?${parametrosFiltro()}`, { headers: { Authorization: `Bearer ${token()}` } });
    if (res.status === 403) {
      mostrarPermisoDenegado();
      return;
    }
    const ventas = await res.json();
    if (!res.ok) {
      document.getElementById("resultado").textContent = JSON.stringify(ventas, null, 2);
      return;
    }

    let totalVendido = 0;
    const filas = document.getElementById("filas");
    filas.innerHTML = "";
    for (const v of ventas) {
      totalVendido += v.total;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${v.fecha_hora}</td>
        <td><span class="badge badge-${v.tipo}">${v.tipo}</span></td>
        <td>${v.mesa_numero ?? "—"}</td>
        <td>${escapeHtml(v.usuario_nombre)}</td>
        <td>$${Number(v.total).toFixed(2)}</td>
      `;
      filas.appendChild(tr);
    }

    document.getElementById("cardTotalVendido").textContent = `$${totalVendido.toFixed(2)}`;
    document.getElementById("cardCantidadVentas").textContent = ventas.length;
  }

  async function exportarCSV() {
    const params = parametrosFiltro();
    params.set("formato", "csv");
    const res = await fetch(`/api/ventas?${params}`, { headers: { Authorization: `Bearer ${token()}` } });
    if (res.status === 403) {
      mostrarPermisoDenegado();
      return;
    }
    if (!res.ok) {
      document.getElementById("resultado").textContent = JSON.stringify(await res.json(), null, 2);
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "reporte_ventas.csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  if (!token()) {
    document.body.innerHTML = "<p>Debes iniciar sesión primero en <a href='login.html'>login.html</a>.</p>";
  } else {
    cargarProductos().then(cargarVentas);
  }
</script>
</body>
</html>
