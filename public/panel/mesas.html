  #qrBox { margin-top: 16px; text-align: center; }
  #qrBox img { max-width: 260px; }
  @media print {
    body * { visibility: hidden; }
    #qrBox, #qrBox * { visibility: visible; }
    #qrBox { position: absolute; top: 0; left: 0; }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-marca">Licorería</div>
    <nav class="sidebar-nav">
      <a href="login.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 4h6a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-6" /><path d="M3 12h13" /><path d="M13 15l3 -3l-3 -3" /></svg>
        <span>Login</span>
      </a>
      <a href="mesas.html" class="nav-item activo">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1" /><rect x="14" y="4" width="6" height="6" rx="1" /><rect x="4" y="14" width="6" height="6" rx="1" /><rect x="14" y="14" width="6" height="6" rx="1" /></svg>
        <span>Mesas</span>
      </a>
      <a href="pedidos.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 8l2 -4h12l2 4" /><path d="M4 8h4l2 3h4l2 -3h4" /><path d="M4 8v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1 -1v-9" /></svg>
        <span>Pedidos entrantes</span>
      </a>
      <a href="productos.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9l-8 4.5l-8 -4.5v-9z" /><path d="M12 12l8 -4.5" /><path d="M12 12v9" /><path d="M12 12l-8 -4.5" /></svg>
        <span>Productos</span>
      </a>
      <a href="proveedores.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="9" width="10" height="7" rx="1" /><path d="M13 12h4l3 3v1h-7z" /><circle cx="7" cy="17.5" r="1.5" /><circle cx="17" cy="17.5" r="1.5" /></svg>
        <span>Proveedores</span>
      </a>
      <a href="inventario.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="2" /><path d="M9 4a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v1a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1z" /><path d="M9 11h6" /><path d="M9 15h6" /></svg>
        <span>Inventario</span>
      </a>
      <a href="ventas.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 3h14v18l-3 -2l-2 2l-2 -2l-2 2l-2 -2l-3 2z" /><path d="M8 8h8" /><path d="M8 12h8" /></svg>
        <span>Ventas</span>
      </a>
      <a href="negocio.html" class="nav-item solo-admin">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 21h18" /><path d="M5 21v-12l7 -5l7 5v12" /><path d="M9 21v-6h6v6" /></svg>
        <span>Datos del negocio</span>
      </a>
    </nav>
  </aside>

  <main class="contenido-principal">
    <h1>Panel de Mesas — Sprint 3</h1>

    <div>
      <label>Número de mesa
        <input id="numero" type="number" min="1">
      </label>
      <button class="btn btn-primario" onclick="crearMesa()">Crear mesa</button>
    </div>

    <table>
      <thead><tr><th>Número</th><th>Estado</th><th>Acción</th></tr></thead>
      <tbody id="filas"></tbody>
    </table>

    <div id="qrBox" class="oculto">
      <p id="qrInfo"></p>
      <img id="qrImg">
      <br><button class="btn" onclick="window.print()">Imprimir QR</button>
    </div>
  </main>

<script>
  function token() { return localStorage.getItem("token"); }

  async function cargarMesas() {
    let mesas;
    try {
      mesas = await Api.pedir("/api/mesas");
    } catch (err) {
      Api.error(err);
      return;
    }
    const filas = document.getElementById("filas");
    filas.innerHTML = "";
    for (const m of mesas) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${m.numero}</td><td>${m.estado}</td>
        <td><button class="btn" onclick="verQR(${m.id_mesa})">Ver / imprimir QR</button></td>`;
      filas.appendChild(tr);
    }
  }

  async function crearMesa() {
    const numero = document.getElementById("numero").value;
    try {
      const mesa = await Api.pedir("/api/mesas", { method: "POST", body: { numero: Number(numero) } });
      Api.exito(`Mesa ${mesa.numero} creada.`);
      document.getElementById("numero").value = "";
      cargarMesas();
    } catch (err) {
      Api.error(err);
    }
  }

  async function verQR(id_mesa) {
    let data;
    try {
      data = await Api.pedir(`/api/mesas/${id_mesa}/qr`);
    } catch (err) {
      Api.error(err);
      return;
    }
    document.getElementById("qrInfo").textContent = `Mesa ${data.mesa_numero} — ${data.url}`;
    document.getElementById("qrImg").src = data.qr_data_url;
    document.getElementById("qrBox").classList.remove("oculto");
  }

  if (!token()) {
    document.body.innerHTML = "<p>Debes iniciar sesión primero en <a href='login.html'>login.html</a>.</p>";
  } else {
    cargarMesas();
    // Sin WebSockets (RF-13/RF-14b): se refresca por polling para que una mesa
    // recién cerrada en pedidos.html se vea libre aquí sin recargar manualmente.
    setInterval(cargarMesas, 5000);
  }
</script>
</body>
</html>
