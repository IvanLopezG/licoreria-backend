<style>
  .mesa { border: 1px solid var(--gris-borde); border-radius: 6px; padding: 12px; margin-top: 16px; }
  .mesa h2 { font-size: 16px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .mesa .total-mesa { font-size: 15px; color: var(--azul-medio); }
  .pedido { border-top: 1px dashed var(--gris-borde); padding: 8px 0; font-size: 13px; }
  .pedido ul { margin: 4px 0; padding-left: 18px; }
  .pedido .meta { color: #666; font-size: 12px; }
  .pedido.nuevo { background: #fff6d8; border-left: 4px solid #d4a017; padding-left: 8px; }
  .pedido.nuevo .badge { background: #d4a017; color: white; }
  .badge-entregado { background: #E3F5E9; color: #1E7A42; }
  .todos-entregados { color: #666; font-size: 13px; font-style: italic; margin: 4px 0; }
  #vacio { color: #666; margin-top: 20px; }
  #error { margin-top: 20px; padding: 10px 14px; background: #FBE4E4; color: var(--rojo); border-left: 4px solid var(--rojo); border-radius: 4px; font-size: 13px; }
  #modalCierre, #modalFactura {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;
  }
  #modalCierre.oculto, #modalFactura.oculto { display: none; }
  #modalCierre .caja {
    background: white; padding: 24px; border-radius: 6px; width: min(420px, 92vw); max-height: 92vh; overflow-y: auto; text-align: center;
  }
  #camposFacturaCierre { text-align: left; margin-bottom: 12px; }
  #modalCierre .error-cierre { color: var(--rojo); font-size: 13px; }
  #modalFactura .caja { background: white; padding: 24px; border-radius: 6px; width: min(360px, 92vw); text-align: center; }
  #modalFactura .total, #modalCierre .total { font-size: 22px; font-weight: bold; margin: 12px 0; }
  #modalCierre .btn { margin: 4px; }
</style>

  <main class="contenido-principal">
    <h1>Pedidos entrantes — se actualiza cada 5s</h1>
    <div id="mesas"></div>
    <p id="vacio" class="oculto">No hay cuentas abiertas.</p>
    <p id="error" class="oculto"></p>
  </main>

  <div id="modalCierre" class="oculto">
    <div class="caja">
      <p id="modalMesaTexto"></p>
      <p>Total consolidado de todos los pedidos abiertos:</p>
      <p class="total" id="modalTotal"></p>
      <div id="camposFacturaCierre"></div>
      <p id="modalCierreError" class="error-cierre oculto"></p>
      <button class="btn btn-peligro" id="botonConfirmarCierre" onclick="confirmarCierre()">Confirmar cierre</button>
      <button class="btn btn-secundario" onclick="cancelarCierre()">Cancelar</button>
    </div>
  </div>

  <div id="modalFactura" class="oculto">
    <div class="caja">
      <p>Cuenta cerrada</p>
      <p id="modalFacturaTexto"></p>
      <p class="total" id="modalFacturaTotal"></p>
      <button class="btn" id="botonVerPdf">Ver PDF</button>
      <button class="btn btn-secundario" onclick="document.getElementById('modalFactura').classList.add('oculto')">Cerrar</button>
    </div>
  </div>

<script src="factura.js"></script>

<script>
  function token() { return localStorage.getItem("token"); }

  // Cancelar un pedido es tarea de administrador/cajero (igual que cobrar);
  // se oculta el botón para mesero en vez de dejar que lo intente y reciba
  // un 403.
  function puedeCancelar() {
    try {
      const usuario = JSON.parse(localStorage.getItem("usuario") || "null");
      return !!usuario && ["administrador", "cajero"].includes(usuario.rol);
    } catch {
      return false;
    }
  }

  function mostrarError(mensaje) {
    const el = document.getElementById("error");
    el.textContent = mensaje;
    el.classList.remove("oculto");
  }

  function ocultarError() {
    document.getElementById("error").classList.add("oculto");
  }

  // US-14b: sin WebSockets: cada poll compara contra los ids ya vistos para
  // saber cuáles pedidos son nuevos desde la última actualización.
  let idsVistos = new Set();
  let primeraCarga = true;

  function totalMesa(pedidos) {
    return pedidos.reduce((suma, p) => suma + p.items.reduce((s, it) => s + it.cantidad * it.precio_unitario, 0), 0);
  }

  async function cargarPedidos() {
    // Se piden TODOS los pedidos (sin filtrar por estado) y se filtra en el
    // cliente a los abiertos (id_venta nulo): un pedido "entregado" sigue sin
    // cobrar hasta el cierre de cuenta, así que la mesa no puede desaparecer
    // de esta pantalla solo porque ya no tiene nada "pendiente" (bug: la
    // tarjeta de la mesa, y con ella el botón de cerrar cuenta, se perdía).
    const res = await fetch("/api/pedidos", { headers: { Authorization: `Bearer ${token()}` } });
    const todos = await res.json();
    if (!res.ok) {
      mostrarError(todos.error || "No se pudieron cargar los pedidos.");
      return;
    }
    ocultarError();
    const pedidos = todos.filter((p) => p.id_venta === null || p.id_venta === undefined);

    const porMesa = {};
    for (const p of pedidos) {
      (porMesa[p.id_mesa] ||= { mesa_numero: p.mesa_numero, pedidos: [] }).pedidos.push(p);
    }

    const contenedor = document.getElementById("mesas");
    contenedor.innerHTML = "";
    document.getElementById("vacio").style.display = Object.keys(porMesa).length === 0 ? "block" : "none";

    for (const [id_mesa, grupo] of Object.entries(porMesa)) {
      const div = document.createElement("div");
      div.className = "mesa";
      const todosEntregados = grupo.pedidos.every((p) => p.estado === "entregado");
      // La lista de ítems se mantiene visible aunque todo esté "entregado":
      // el mesero necesita verla para verificar antes de cobrar. El aviso de
      // "todo entregado" va aparte, nunca reemplazando la lista.
      let html = `<h2>Mesa ${grupo.mesa_numero} <span class="total-mesa">$${totalMesa(grupo.pedidos).toFixed(2)}</span></h2>`;
      if (todosEntregados) {
        html += `<p class="todos-entregados">Todos los pedidos fueron entregados.</p>`;
      }
      for (const pedido of grupo.pedidos) {
        const esNuevo = !primeraCarga && !idsVistos.has(pedido.id_pedido);
        const yaEntregado = pedido.estado === "entregado";
        html += `<div class="pedido${esNuevo ? " nuevo" : ""}">
          <span class="meta">Pedido #${pedido.id_pedido} — ${pedido.fecha_hora}${esNuevo ? '<span class="badge">NUEVO</span>' : ""}${yaEntregado ? '<span class="badge badge-entregado">ENTREGADO</span>' : ""}</span>
          <ul>${pedido.items.map((it) => `<li>${it.cantidad} x ${it.producto_nombre}</li>`).join("")}</ul>
          ${yaEntregado ? "" : `<button class="btn" onclick="marcarEntregado(${pedido.id_pedido})">Marcar entregado</button>`}
          ${puedeCancelar() ? `<button class="btn btn-peligro" onclick="cancelarPedido(${pedido.id_pedido})">Cancelar pedido</button>` : ""}
        </div>`;
      }
      html += `<button class="btn btn-peligro" onclick="cerrarCuenta(${id_mesa}, ${grupo.mesa_numero})">Cerrar cuenta de la mesa</button>`;
      div.innerHTML = html;
      contenedor.appendChild(div);
    }

    idsVistos = new Set(pedidos.map((p) => p.id_pedido));
    primeraCarga = false;
  }

  async function marcarEntregado(id_pedido) {
    const res = await fetch(`/api/pedidos/${id_pedido}/entregado`, {
      method: "PUT",
      headers: { Authorization: `Bearer ${token()}` },
    });
    if (!res.ok) {
      const data = await res.json();
      mostrarError(data.error || "No se pudo marcar el pedido como entregado.");
      return;
    }
    cargarPedidos();
  }

  async function cancelarPedido(id_pedido) {
    if (!confirm(`¿Cancelar el pedido #${id_pedido}? Esta acción no se puede deshacer.`)) return;

    const res = await fetch(`/api/pedidos/${id_pedido}`, {
      method: "DELETE",
      headers: { Authorization: `Bearer ${token()}` },
    });
    if (!res.ok) {
      const data = await res.json();
      mostrarError(data.error || "No se pudo cancelar el pedido.");
      return;
    }
    ocultarError();
    cargarPedidos();
  }

  // US-14: antes de cerrar, se consolidan TODOS los pedidos abiertos de la mesa
  // (id_venta nulo), no solo los pendientes que se ven en pantalla — un pedido
  // ya "entregado" sigue abierto hasta que se cobra.
  let mesaPendienteCierre = null;

  async function cerrarCuenta(id_mesa, mesa_numero) {
    const res = await fetch(`/api/pedidos?id_mesa=${id_mesa}`, {
      headers: { Authorization: `Bearer ${token()}` },
    });
    const pedidos = await res.json();
    if (!res.ok) {
      mostrarError(pedidos.error || "No se pudo calcular el total de la mesa.");
      return;
    }
    ocultarError();

    const abiertos = pedidos.filter((p) => p.id_venta === null || p.id_venta === undefined);
    const total = totalMesa(abiertos);

    mesaPendienteCierre = id_mesa;
    Factura.limpiarCampos("cierre");
    document.getElementById("modalCierreError").classList.add("oculto");
    document.getElementById("botonConfirmarCierre").disabled = false;
    document.getElementById("modalMesaTexto").textContent = `Mesa ${mesa_numero}`;
    document.getElementById("modalTotal").textContent = `$${total.toFixed(2)}`;
    document.getElementById("modalCierre").classList.remove("oculto");
  }

  function cancelarCierre() {
    mesaPendienteCierre = null;
    document.getElementById("modalCierre").classList.add("oculto");
  }

  // Forma de pago y cliente son opcionales: sin tocarlos se cobra en
  // efectivo a "Consumidor Final", igual que antes.
  async function confirmarCierre() {
    const id_mesa = mesaPendienteCierre;
    if (!id_mesa) return;
    const errorCierre = document.getElementById("modalCierreError");
    const { datos, error } = Factura.leerCampos("cierre");
    if (error) {
      errorCierre.textContent = error;
      errorCierre.classList.remove("oculto");
      return;
    }
    document.getElementById("botonConfirmarCierre").disabled = true;

    const res = await fetch(`/api/mesas/${id_mesa}/cerrar-cuenta`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token()}` },
      body: JSON.stringify(datos),
    });
    const data = await res.json();
    document.getElementById("modalCierre").classList.add("oculto");
    if (!res.ok) {
      mostrarError(data.error || "No se pudo cerrar la cuenta de la mesa.");
    } else {
      ocultarError();
      mostrarFactura(data.factura);
    }
    mesaPendienteCierre = null;
    cargarPedidos();
  }

  function mostrarFactura(factura) {
    if (!factura) return;
    document.getElementById("modalFacturaTexto").textContent = `Factura No. ${factura.numero_completo}`;
    document.getElementById("modalFacturaTotal").textContent = `$${Number(factura.total).toFixed(2)}`;
    document.getElementById("botonVerPdf").onclick = () => Factura.abrirPdf(factura.id_factura);
    document.getElementById("modalFactura").classList.remove("oculto");
  }

  if (!token()) {
    document.body.innerHTML = "<p>Debes iniciar sesión primero en <a href='login.html'>login.html</a>.</p>";
  } else {
    Factura.pintarCampos(document.getElementById("camposFacturaCierre"), "cierre");
    cargarPedidos();
    setInterval(cargarPedidos, 5000);
  }
</script>
</body>
