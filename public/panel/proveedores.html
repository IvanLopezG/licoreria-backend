<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Licorería — Proveedores</title>
<style>
  body { font-family: Calibri, Arial, sans-serif; max-width: 820px; margin: 40px auto; color: #1F3864; }
  h1 { font-size: 20px; }
  nav a { margin-right: 12px; font-size: 13px; }
  label { display: block; margin-top: 12px; font-size: 14px; }
  input, select { padding: 8px; box-sizing: border-box; margin-top: 4px; width: 100%; }
  .fila-form { display: flex; gap: 16px; flex-wrap: wrap; }
  .fila-form label { flex: 1; min-width: 160px; }
  button { margin-top: 16px; padding: 8px 16px; background: #1F3864; color: white; border: none; cursor: pointer; }
  button:hover { background: #2E5395; }
  table { width: 100%; border-collapse: collapse; margin-top: 24px; }
  th, td { border: 1px solid #ccc; padding: 8px; font-size: 13px; text-align: left; vertical-align: top; }
  .asociar { display: flex; gap: 6px; align-items: center; }
  .asociar select { width: auto; flex: 1; margin-top: 0; }
  .asociar button { margin-top: 0; padding: 6px 10px; }
  #resultado { margin-top: 20px; padding: 12px; background: #f1f1f1; white-space: pre-wrap; font-size: 13px; }
  .error-permiso { margin-top: 20px; padding: 12px; background: #ffe1e1; border-left: 4px solid #8B0000; }
</style>
</head>
<body>
  <nav>
    <a href="login.html">Login</a>
    <a href="mesas.html">Mesas</a>
    <a href="pedidos.html">Pedidos entrantes</a>
    <a href="productos.html">Productos</a>
    <a href="proveedores.html">Proveedores</a>
    <a href="inventario.html">Inventario</a>
    <a href="ventas.html">Ventas</a>
  </nav>
  <h1>Proveedores — Sprint 2</h1>

  <div id="contenido">
    <form id="formProveedor" onsubmit="return guardarProveedor(event)">
      <div class="fila-form">
        <label>Nombre
          <input id="nombre" required>
        </label>
        <label>Contacto
          <input id="contacto" placeholder="teléfono, correo...">
        </label>
      </div>
      <button type="submit">Crear proveedor</button>
    </form>

    <table>
      <thead>
        <tr><th>Nombre</th><th>Contacto</th><th>Productos asociados</th><th>Asociar producto</th></tr>
      </thead>
      <tbody id="filas"></tbody>
    </table>

    <pre id="resultado"></pre>
  </div>

<script>
  function token() { return localStorage.getItem("token"); }

  function escapeHtml(texto) {
    return String(texto).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function mostrarPermisoDenegado() {
    document.getElementById("contenido").innerHTML =
      '<p class="error-permiso">No tienes permiso para ver esta sección.</p>';
  }

  let productosCache = [];

  async function cargarProductos() {
    const res = await fetch("/api/productos", { headers: { Authorization: `Bearer ${token()}` } });
    if (res.status === 403) {
      mostrarPermisoDenegado();
      return;
    }
    productosCache = await res.json();
  }

  async function cargarProveedores() {
    const res = await fetch("/api/proveedores", { headers: { Authorization: `Bearer ${token()}` } });
    if (res.status === 403) {
      mostrarPermisoDenegado();
      return;
    }
    const proveedores = await res.json();
    if (!res.ok) {
      document.getElementById("resultado").textContent = JSON.stringify(proveedores, null, 2);
      return;
    }

    // El listado general no trae los productos asociados; se pide el detalle
    // de cada proveedor aparte para mostrarlos en la misma fila.
    const detalles = await Promise.all(
      proveedores.map((p) =>
        fetch(`/api/proveedores/${p.id_proveedor}`, { headers: { Authorization: `Bearer ${token()}` } }).then((r) =>
          r.json()
        )
      )
    );

    const filas = document.getElementById("filas");
    filas.innerHTML = "";
    for (const p of detalles) {
      const opciones = productosCache
        .filter((prod) => !p.productos.some((asociado) => asociado.id_producto === prod.id_producto))
        .map((prod) => `<option value="${prod.id_producto}">${escapeHtml(prod.nombre)}</option>`)
        .join("");
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${escapeHtml(p.nombre)}</td>
        <td>${escapeHtml(p.contacto || "—")}</td>
        <td>${p.productos.length ? escapeHtml(p.productos.map((x) => x.nombre).join(", ")) : "—"}</td>
        <td>
          <div class="asociar">
            <select id="select-${p.id_proveedor}">${opciones || "<option>(sin productos por asociar)</option>"}</select>
            <button type="button" onclick="asociarProducto(${p.id_proveedor})">Asociar</button>
          </div>
        </td>
      `;
      filas.appendChild(tr);
    }
  }

  async function guardarProveedor(evento) {
    evento.preventDefault();
    const cuerpo = {
      nombre: document.getElementById("nombre").value,
      contacto: document.getElementById("contacto").value || null,
    };
    const res = await fetch("/api/proveedores", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token()}` },
      body: JSON.stringify(cuerpo),
    });
    if (res.status === 403) {
      mostrarPermisoDenegado();
      return;
    }
    const data = await res.json();
    document.getElementById("resultado").textContent = JSON.stringify(data, null, 2);
    if (res.ok) {
      document.getElementById("formProveedor").reset();
      cargarProveedores();
    }
  }

  async function asociarProducto(id_proveedor) {
    const select = document.getElementById(`select-${id_proveedor}`);
    const id_producto = Number(select.value);
    if (!id_producto) return;

    const res = await fetch(`/api/proveedores/${id_proveedor}/productos`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token()}` },
      body: JSON.stringify({ id_producto }),
    });
    if (res.status === 403) {
      mostrarPermisoDenegado();
      return;
    }
    const data = await res.json();
    document.getElementById("resultado").textContent = JSON.stringify(data, null, 2);
    if (res.ok) cargarProveedores();
  }

  if (!token()) {
    document.body.innerHTML = "<p>Debes iniciar sesión primero en <a href='login.html'>login.html</a>.</p>";
  } else {
    cargarProductos().then(cargarProveedores);
  }
</script>
</body>
</html>
