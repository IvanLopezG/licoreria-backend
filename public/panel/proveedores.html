  .asociar select { width: auto; flex: 1; margin-top: 0; }

<body>

      <a href="pedidos.html" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 8l2 -4h12l2 4" /><path d="M4 8h4l2 3h4l2 -3h4" /><path d="M4 8v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1 -1v-9" /></svg>

        <span>Productos</span>
      </a>
      <a href="proveedores.html" class="nav-item activo">
        <svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="9" width="10" height="7" rx="1" /><path d="M13 12h4l3 3v1h-7z" /><circle cx="7" cy="17.5" r="1.5" /><circle cx="17" cy="17.5" r="1.5" /></svg>
        <span>Proveedores</span>
      </a>
      <a href="inventario.html" class="nav-item">

        <span>Datos del negocio</span>
      </a>

  </aside>

  <main class="contenido-principal">
    <h1>Proveedores — Sprint 2</h1>

    <div id="contenido">
      <form id="formProveedor" onsubmit="return guardarProveedor(event)">
        <div class="fila-form">
          <label>Nombre
            <input id="nombre" required>
          </label>
          <label>Contacto
            <input id="contacto" placeholder="teléfono, correo...">
          </label>
        </div>
        <button type="submit" class="btn btn-primario">Crear proveedor</button>
      </form>

      <table>
        <thead>
          <tr><th>Nombre</th><th>Contacto</th><th>Productos asociados</th><th>Asociar producto</th></tr>
        </thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
  </main>

<script>
  function token() { return localStorage.getItem("token"); }

  function escapeHtml(texto) {
    return String(texto).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function mostrarPermisoDenegado() {
    document.getElementById("contenido").innerHTML =
      '<p class="error-permiso">No tienes permiso para ver esta sección.</p>';
  }

  // Sin permiso (403) la sección entera se reemplaza; el resto de errores se
  // muestra como aviso.
  function manejarError(err) {
    if (err.status === 403) mostrarPermisoDenegado();
    else Api.error(err);
  }

  let productosCache = [];

  async function cargarProductos() {
    try {
      productosCache = await Api.pedir("/api/productos");
    } catch (err) {
      manejarError(err);
    }
  }

  async function cargarProveedores() {
    let detalles;
    try {
      const proveedores = await Api.pedir("/api/proveedores");
      // El listado general no trae los productos asociados; se pide el detalle
      // de cada proveedor aparte para mostrarlos en la misma fila.
      detalles = await Promise.all(proveedores.map((p) => Api.pedir(`/api/proveedores/${p.id_proveedor}`)));
    } catch (err) {
      manejarError(err);
      return;
    }

    const filas = document.getElementById("filas");
    filas.innerHTML = "";
    for (const p of detalles) {
      const opciones = productosCache
        .filter((prod) => !p.productos.some((asociado) => asociado.id_producto === prod.id_producto))
        .map((prod) => `<option value="${prod.id_producto}">${escapeHtml(prod.nombre)}</option>`)
        .join("");
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${escapeHtml(p.nombre)}</td>
        <td>${escapeHtml(p.contacto || "—")}</td>
        <td>${p.productos.length ? escapeHtml(p.productos.map((x) => x.nombre).join(", ")) : "—"}</td>
        <td>
          <div class="asociar">
            <select id="select-${p.id_proveedor}">${opciones || "<option>(sin productos por asociar)</option>"}</select>
            <button type="button" class="btn" onclick="asociarProducto(${p.id_proveedor})">Asociar</button>
          </div>
        </td>
      `;
      filas.appendChild(tr);
    }
  }

  async function guardarProveedor(evento) {
    evento.preventDefault();
    const cuerpo = {
      nombre: document.getElementById("nombre").value,
      contacto: document.getElementById("contacto").value || null,
    };
    try {
      const proveedor = await Api.pedir("/api/proveedores", { method: "POST", body: cuerpo });
      Api.exito(`Proveedor "${proveedor.nombre}" creado.`);
      document.getElementById("formProveedor").reset();
      cargarProveedores();
    } catch (err) {
      manejarError(err);
    }
  }

  async function asociarProducto(id_proveedor) {
    const select = document.getElementById(`select-${id_proveedor}`);
    const id_producto = Number(select.value);
    if (!id_producto) return;

    try {
      await Api.pedir(`/api/proveedores/${id_proveedor}/productos`, { method: "POST", body: { id_producto } });
      Api.exito("Producto asociado al proveedor.");
      cargarProveedores();
    } catch (err) {
      manejarError(err);
    }
  }

  if (!token()) {
    document.body.innerHTML = "<p>Debes iniciar sesión primero en <a href='login.html'>login.html</a>.</p>";
  } else {
    cargarProductos().then(cargarProveedores);
  }
</script>
</body>
</html>
