<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licorería — Iniciar sesión</title>
<link rel="stylesheet" href="panel.css">
<script src="api.js"></script>
<style>
  /* Pantalla propia, sin barra lateral: fondo oscuro tipo bar y tarjeta centrada. */
  body.pagina-login {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Calibri, Arial, sans-serif;
    color: #1d2330;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(176, 122, 47, 0.28), transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(110, 25, 40, 0.35), transparent 60%),
      linear-gradient(160deg, #1a1210 0%, #12151c 55%, #0b0d12 100%);
  }

  .tarjeta-login {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 16px;
    padding: 32px 28px 28px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.2);
  }

  .login-cabecera { text-align: center; margin-bottom: 24px; }
  .login-logo {
    width: 52px; height: 52px; margin: 0 auto 12px;
    border-radius: 14px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, #b07a2f, #7a1f2b);
    color: #fff;
  }
  .login-logo svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .login-titulo { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0.01em; color: #1d2330; }
  .login-subtitulo { margin: 4px 0 0; font-size: 14px; color: #6b7280; }

  .campo { margin-top: 16px; }
  .campo label { display: block; margin: 0 0 6px; font-size: 14px; font-weight: 600; color: #374151; }
  .campo input {
    width: 100%;
    margin: 0;
    padding: 11px 12px;
    font: inherit;
    font-size: 15px;
    color: #1d2330;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    background: #fafafa;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .campo input:focus {
    outline: none;
    border-color: #b07a2f;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(176, 122, 47, 0.28);
  }

  .campo-clave { position: relative; }
  .campo-clave input { padding-right: 84px; }
  .ver-clave {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    padding: 6px 10px;
    font: inherit; font-size: 13px; font-weight: 600;
    color: #7a4f16;
    background: transparent;
    border: 0; border-radius: 8px;
    cursor: pointer;
  }
  .ver-clave:hover { background: #f5ecdf; }
  .ver-clave:focus-visible { outline: 2px solid #b07a2f; outline-offset: 1px; }

  .btn-ingresar {
    width: 100%;
    margin-top: 24px;
    padding: 12px 16px;
    font: inherit; font-size: 16px; font-weight: 700;
    color: #fff;
    background: linear-gradient(145deg, #8c5a1c, #6e1d2a);
    border: 0; border-radius: 10px;
    cursor: pointer;
    transition: filter 0.15s, transform 0.05s;
  }
  .btn-ingresar:hover:not(:disabled) { filter: brightness(1.08); }
  .btn-ingresar:active:not(:disabled) { transform: translateY(1px); }
  .btn-ingresar:focus-visible { outline: 3px solid rgba(176, 122, 47, 0.55); outline-offset: 2px; }
  .btn-ingresar:disabled { cursor: progress; opacity: 0.75; }

  .login-espera {
    margin: 12px 0 0;
    font-size: 13px;
    text-align: center;
    color: #7a4f16;
  }


  @media (max-width: 420px) {
    .tarjeta-login { padding: 26px 20px 22px; border-radius: 14px; }
    .login-titulo { font-size: 22px; }
  }
</style>
</head>
<body class="pagina-login">
  <main class="tarjeta-login">
    <div class="login-cabecera">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M8 3h8" /><path d="M9 3v4.5a3 3 0 0 1 -1 2.2a4 4 0 0 0 -1.5 3.1v6.2a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-6.2a4 4 0 0 0 -1.5 -3.1a3 3 0 0 1 -1 -2.2v-4.5" /><path d="M6.5 14h11" /></svg>
      </div>
      <h1 class="login-titulo">Licorería</h1>
      <p class="login-subtitulo">Panel interno</p>
    </div>

    <form id="bloqueLogin" onsubmit="login(); return false;" novalidate>
      <div class="campo">
        <label for="usuario_login">Usuario</label>
        <input id="usuario_login" value="admin" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <div class="campo-clave">
          <input id="password" type="password" autocomplete="current-password" required>
          <button type="button" class="ver-clave" id="verClave" onclick="alternarClave()"
                  aria-controls="password" aria-pressed="false">Mostrar</button>
        </div>
      </div>
      <button type="submit" class="btn-ingresar" id="btnIngresar">Ingresar</button>
      <p id="loginEspera" class="login-espera oculto" role="status">
        Conectando con el servidor, puede tardar unos segundos…
      </p>
    </form>

    <!-- Solo mientras se valida un token guardado; no muestra datos del usuario. -->
    <p id="verificando" class="login-espera oculto" role="status">Verificando sesión…</p>
  </main>

<script>
  // El servidor está en Render (plan gratuito) y puede tardar en despertar:
  // si el login demora más de esto, se avisa en vez de dejar al usuario a ciegas.
  const ESPERA_LENTA_MS = 4000;
  // Pedidos es accesible para los tres roles (mesero, cajero, administrador).
  const INICIO_PANEL = "pedidos.html";
  let enviando = false;

  function guardarSesion(token, usuario) {
    localStorage.setItem("token", token);
    localStorage.setItem("usuario", JSON.stringify(usuario));
  }

  function limpiarSesion() {
    localStorage.removeItem("token");
    localStorage.removeItem("usuario");
  }

  function irAlPanel() {
    // replace: "Atrás" desde Pedidos no vuelve al login.
    window.location.replace(INICIO_PANEL);
  }

  function mostrarFormulario() {
    document.getElementById("verificando").classList.add("oculto");
    document.getElementById("bloqueLogin").classList.remove("oculto");
  }

  // Si ya hay un token, se valida con el backend antes de redirigir: así un
  // token vencido no manda a Pedidos (y no hay bucle, porque Pedidos nunca
  // redirige al login). 401 → se limpia la sesión y queda el formulario.
  async function verificarSesionGuardada() {
    if (!localStorage.getItem("token")) {
      mostrarFormulario();
      return;
    }
    document.getElementById("bloqueLogin").classList.add("oculto");
    const verificando = document.getElementById("verificando");
    verificando.classList.remove("oculto");
    const avisoLento = setTimeout(() => {
      verificando.textContent = "Conectando con el servidor, puede tardar unos segundos…";
    }, ESPERA_LENTA_MS);
    try {
      await Api.pedir("/api/auth/me");
      irAlPanel();
    } catch (err) {
      if (err.status === 401) {
        limpiarSesion();
      } else {
        // Sin conexión o error del servidor: no se puede confirmar la sesión.
        // Se muestra el formulario (sin redirigir) y el motivo.
        Api.error(err);
      }
      mostrarFormulario();
    } finally {
      clearTimeout(avisoLento);
    }
  }

  function alternarClave() {
    const campo = document.getElementById("password");
    const boton = document.getElementById("verClave");
    const visible = campo.type === "password";
    campo.type = visible ? "text" : "password";
    boton.textContent = visible ? "Ocultar" : "Mostrar";
    boton.setAttribute("aria-pressed", String(visible));
    campo.focus();
  }

  // Botón deshabilitado mientras se envía (evita doble envío) y aviso si tarda.
  function estadoEnvio(activo) {
    enviando = activo;
    const boton = document.getElementById("btnIngresar");
    boton.disabled = activo;
    boton.textContent = activo ? "Ingresando…" : "Ingresar";
    if (!activo) document.getElementById("loginEspera").classList.add("oculto");
  }

  async function login() {
    if (enviando) return;
    const usuario_login = document.getElementById("usuario_login").value;
    const password = document.getElementById("password").value;
    estadoEnvio(true);
    const avisoLento = setTimeout(
      () => document.getElementById("loginEspera").classList.remove("oculto"),
      ESPERA_LENTA_MS
    );
    try {
      const data = await Api.pedir("/api/auth/login", { method: "POST", body: { usuario_login, password }, auth: false });
      guardarSesion(data.token, data.usuario);
      document.getElementById("password").value = "";
      clearTimeout(avisoLento);
      irAlPanel();
      return;
    } catch (err) {
      Api.error(err);
    } finally {
      clearTimeout(avisoLento);
    }
    estadoEnvio(false);
  }

  verificarSesionGuardada();
</script>
</body>
</html>
