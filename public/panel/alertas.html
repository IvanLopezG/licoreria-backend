  <main class="contenido-principal">
    <h1>Alertas de stock</h1>

    <div id="contenido">
      <div class="barra-filtros" style="margin-top: 0">
        <p class="ayuda" id="parametros" style="flex: 1 1 320px; margin: 0"></p>
        <button type="button" class="btn" id="btnActualizar" style="margin-top: 0">Actualizar</button>
      </div>

      <p class="estado-carga oculto" id="cargando" role="status">Cargando alertas…</p>
      <div class="caja-error oculto" id="error" role="alert">
        <span id="errorTexto"></span>
        <button type="button" class="btn" id="btnReintentar">Reintentar</button>
      </div>
      <p class="estado-vacio oculto" id="vacio">Todo el stock está en orden</p>
      <div id="grupos"></div>
    </div>
  </main>

<script>
  // Alertas de stock (GET /api/alertas-stock, con los valores por defecto del
  // backend). Agrupadas por estado en orden de urgencia; un estado desconocido
  // se ignora (igual que la app). Los nombres se insertan con textContent.
  function token() { return localStorage.getItem("token"); }

  function irAlLogin() {
    localStorage.removeItem("token");
    localStorage.removeItem("usuario");
    window.location.replace("login.html");
  }

  const $ = (id) => document.getElementById(id);
  let consulta = 0;

  function mostrar(cual) {
    $("cargando").classList.toggle("oculto", cual !== "cargando");
    $("error").classList.toggle("oculto", cual !== "error");
    $("vacio").classList.toggle("oculto", cual !== "vacio");
    $("grupos").classList.toggle("oculto", cual !== "lista");
  }

  function mostrarError(texto, reintentable) {
    $("errorTexto").textContent = texto;
    $("btnReintentar").classList.toggle("oculto", !reintentable);
    mostrar("error");
  }

  function actualizarContador(n) {
    if (typeof MenuPanel !== "undefined") MenuPanel.actualizarContadorAlertas(n);
  }

  async function cargar() {
    const propia = ++consulta;
    $("btnActualizar").disabled = true;
    mostrar("cargando");
    try {
      const datos = (await Api.pedir("/api/alertas-stock")) || {};
      if (propia !== consulta) return;
      pintar(datos);
    } catch (err) {
      if (propia !== consulta) return;
      if (err.status === 401) return irAlLogin();
      if (err.status === 403) return mostrarError("No tienes permiso para ver las alertas de stock", false);
      mostrarError(Api.mensajeDe(err), true);
    } finally {
      if (propia === consulta) $("btnActualizar").disabled = false;
    }
  }

  // Qué significan los números, con los parámetros que usó el backend.
  function textoParametros(p) {
    if (!p) return "";
    const partes = [];
    if (p.ventana_dias) partes.push(`Cobertura según las ventas de los últimos ${p.ventana_dias} días.`);
    if (p.cobertura_alerta_dias) partes.push(`Por agotarse: menos de ${Gestion.textoCobertura(p.cobertura_alerta_dias)} de cobertura.`);
    if (p.dias_objetivo) partes.push(`Cantidad sugerida para ${Gestion.textoCobertura(p.dias_objetivo)} de venta.`);
    return partes.join(" ");
  }

  function celda(texto, clase) {
    const td = document.createElement("td");
    td.textContent = texto;
    if (clase) td.className = clase;
    return td;
  }

  function pintar(datos) {
    $("parametros").textContent = textoParametros(datos.parametros);
    const grupos = Gestion.agruparAlertas(datos.productos);
    actualizarContador(Gestion.contarAlertas(datos.productos));
    const caja = $("grupos");
    caja.replaceChildren();
    if (grupos.length === 0) return mostrar("vacio");

    for (const grupo of grupos) {
      const seccion = document.createElement("div");
      seccion.className = "seccion grupo-alertas";
      const h2 = document.createElement("h2");
      const badge = document.createElement("span");
      badge.className = `badge ${grupo.clase}`;
      badge.textContent = grupo.titulo;
      const cuenta = document.createElement("span");
      cuenta.textContent = grupo.productos.length === 1 ? "1 producto" : `${grupo.productos.length} productos`;
      h2.append(badge, cuenta);

      const tabla = document.createElement("table");
      tabla.innerHTML =
        "<thead><tr><th>Producto</th><th class=\"celda-numero\">Stock actual</th><th class=\"celda-numero\">Mínimo</th>" +
        "<th class=\"celda-numero\">Días de cobertura</th><th class=\"celda-numero\">Cantidad sugerida</th></tr></thead>";
      const tbody = document.createElement("tbody");
      for (const p of grupo.productos) {
        const tr = document.createElement("tr");
        const nombre = document.createElement("td");
        nombre.textContent = p.nombre || "(sin nombre)";
        const detalle = [p.categoria_nombre, p.unidad_medida].filter(Boolean).join(" · ");
        if (detalle) {
          const d = document.createElement("div");
          d.className = "dato-secundario";
          d.textContent = detalle;
          nombre.appendChild(d);
        }
        if (Gestion.sinVentasRecientes(p)) {
          const nota = document.createElement("div");
          nota.className = "nota-sin-ventas";
          nota.textContent = Gestion.SIN_VENTAS_RECIENTES;
          nombre.appendChild(nota);
        }
        const sugerida = Number(p.cantidad_sugerida) || 0;
        tr.append(
          nombre,
          celda(Gestion.formatoNumero(p.stock_actual), "celda-numero"),
          celda(Gestion.formatoNumero(p.umbral_alerta), "celda-numero"),
          celda(Gestion.textoCobertura(p.dias_cobertura), "celda-numero"),
          celda(sugerida > 0 ? Gestion.formatoNumero(sugerida) : "—", "celda-numero")
        );
        tbody.appendChild(tr);
      }
      tabla.appendChild(tbody);
      const desplazable = document.createElement("div");
      desplazable.className = "tabla-desplazable";
      desplazable.appendChild(tabla);
      seccion.append(h2, desplazable);
      caja.appendChild(seccion);
    }
    mostrar("lista");
  }

  $("btnActualizar").addEventListener("click", cargar);
  $("btnReintentar").addEventListener("click", cargar);

  if (!token()) {
    document.body.innerHTML = "<p>Debes iniciar sesión primero en <a href='login.html'>login.html</a>.</p>";
  } else {
    cargar();
  }
</script>
