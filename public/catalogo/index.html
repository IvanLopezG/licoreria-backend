<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Licorería — Catálogo</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Calibri, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px 16px 120px; color: #1F3864; }
  h1 { font-size: 18px; margin-bottom: 0; }
  #mesaInfo { font-size: 13px; color: #666; margin-top: 4px; }
  .historial { margin-top: 16px; border: 1px solid #ccc; border-radius: 6px; padding: 10px 12px; background: #fafafa; }
  .historial-titulo { font-weight: bold; font-size: 14px; margin-bottom: 6px; }
  .historial-pedido { font-size: 13px; margin-bottom: 8px; }
  .historial-pedido:last-child { margin-bottom: 0; }
  .historial-pedido .hora { color: #666; font-size: 11px; margin-bottom: 2px; }
  .historial-pedido div { display: flex; justify-content: space-between; }
  #historialTotal { font-weight: bold; font-size: 13px; margin-top: 8px; border-top: 1px dashed #ccc; padding-top: 6px; }
  .categoria { margin-top: 20px; font-size: 15px; font-weight: bold; border-bottom: 1px solid #ccc; padding-bottom: 4px; }
  .producto { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; gap: 8px; }
  .producto .info { flex: 1; }
  .producto .nombre { font-size: 14px; display: block; }
  .producto .precio { font-size: 13px; color: #444; }
  .producto input { width: 50px; padding: 6px; text-align: center; }
  .producto button { padding: 6px 10px; background: #1F3864; color: white; border: none; cursor: pointer; }
  #estado { margin-top: 30px; text-align: center; color: #666; }
  #carrito { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 2px solid #1F3864;
             padding: 12px 16px; max-width: 480px; margin: 0 auto; }
  #carritoLista { max-height: 120px; overflow-y: auto; font-size: 13px; margin-bottom: 8px; }
  #carritoLista div { display: flex; justify-content: space-between; padding: 2px 0; }
  #totalCarrito { font-weight: bold; }
  #confirmarBtn { width: 100%; padding: 12px; background: #1F3864; color: white; border: none; cursor: pointer; font-size: 15px; }
  #confirmarBtn:disabled { background: #aaa; cursor: not-allowed; }
  .oculto { display: none; }
</style>
</head>
<body>
  <h1>Menú</h1>
  <p id="mesaInfo">Cargando...</p>

  <div id="historial" class="oculto">
    <div class="historial-titulo">Tu pedido hasta ahora</div>
    <div id="historialLista"></div>
    <p id="historialTotal"></p>
  </div>

  <div id="listado"></div>
  <p id="estado"></p>

  <div id="carrito" class="oculto">
    <div id="carritoLista"></div>
    <p id="totalCarrito"></p>
    <button id="confirmarBtn" onclick="confirmarPedido()">Confirmar pedido</button>
  </div>

<script>
  const carrito = {}; // id_producto -> { producto, cantidad }

  function obtenerToken() {
    return new URLSearchParams(window.location.search).get("token");
  }
  const token = obtenerToken();

  function agregarAlCarrito(producto, cantidadInput) {
    const cantidad = Number(cantidadInput.value);
    if (!Number.isInteger(cantidad) || cantidad < 1) {
      alert("La cantidad debe ser un número entero de al menos 1.");
      return;
    }
    carrito[producto.id_producto] = { producto, cantidad };
    cantidadInput.value = 1;
    renderCarrito();
  }

  function renderCarrito() {
    const items = Object.values(carrito);
    const box = document.getElementById("carrito");
    if (items.length === 0) {
      box.classList.add("oculto");
      return;
    }
    box.classList.remove("oculto");

    const lista = document.getElementById("carritoLista");
    lista.innerHTML = "";
    let total = 0;
    for (const { producto, cantidad } of items) {
      const subtotal = producto.precio * cantidad;
      total += subtotal;
      const fila = document.createElement("div");
      fila.innerHTML = `<span>${cantidad} x ${producto.nombre}</span><span>$${subtotal.toLocaleString("es-CO")}</span>`;
      lista.appendChild(fila);
    }
    document.getElementById("totalCarrito").textContent = `Total: $${total.toLocaleString("es-CO")}`;
  }

  async function confirmarPedido() {
    const items = Object.values(carrito).map(({ producto, cantidad }) => ({
      id_producto: producto.id_producto,
      cantidad,
    }));
    if (items.length === 0) return;

    const btn = document.getElementById("confirmarBtn");
    btn.disabled = true;

    const res = await fetch(`/api/catalogo/${token}/pedidos`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ items }),
    });
    const data = await res.json();

    if (!res.ok) {
      alert(data.error || "No se pudo enviar el pedido.");
      btn.disabled = false;
      return;
    }

    document.getElementById("carrito").classList.add("oculto");
    document.getElementById("estado").textContent = "¡Pedido enviado! Ya lo están preparando. Puedes seguir agregando productos para una nueva ronda.";
    Object.keys(carrito).forEach((k) => delete carrito[k]);
    // El botón queda deshabilitado desde antes del fetch; si no se reactiva
    // aquí, la próxima vez que el carrito vuelva a tener productos el botón
    // reaparece pero sigue bloqueado, y el cliente no puede confirmar una
    // segunda ronda sin recargar la página.
    btn.disabled = false;

    cargarHistorial();
  }

  async function cargarHistorial() {
    if (!token) return;

    const res = await fetch(`/api/catalogo/${token}/pedidos`);
    const pedidos = await res.json();
    if (!res.ok) return;

    const caja = document.getElementById("historial");
    const lista = document.getElementById("historialLista");
    lista.innerHTML = "";

    if (pedidos.length === 0) {
      caja.classList.add("oculto");
      return;
    }
    caja.classList.remove("oculto");

    let total = 0;
    for (const pedido of pedidos) {
      const div = document.createElement("div");
      div.className = "historial-pedido";
      const lineas = pedido.items
        .map((it) => {
          total += it.cantidad * it.precio_unitario;
          return `<div><span>${it.cantidad} x ${it.producto_nombre}</span><span>$${(it.cantidad * it.precio_unitario).toLocaleString("es-CO")}</span></div>`;
        })
        .join("");
      div.innerHTML = `<div class="hora">${pedido.fecha_hora}</div>${lineas}`;
      lista.appendChild(div);
    }
    document.getElementById("historialTotal").textContent = `Total acumulado: $${total.toLocaleString("es-CO")}`;
  }

  async function cargarCatalogo() {
    if (!token) {
      document.getElementById("estado").textContent = "QR inválido: falta el token de la mesa.";
      return;
    }

    const res = await fetch(`/api/catalogo/${token}`);
    const data = await res.json();

    if (!res.ok) {
      document.getElementById("mesaInfo").textContent = "";
      document.getElementById("estado").textContent = data.error || "No se pudo cargar el catálogo.";
      return;
    }

    document.getElementById("mesaInfo").textContent = `Mesa ${data.mesa.numero}`;

    const porCategoria = {};
    for (const p of data.productos) {
      (porCategoria[p.categoria_nombre] ||= []).push(p);
    }

    const listado = document.getElementById("listado");
    listado.innerHTML = "";
    for (const [categoria, productos] of Object.entries(porCategoria)) {
      const h = document.createElement("div");
      h.className = "categoria";
      h.textContent = categoria;
      listado.appendChild(h);

      for (const p of productos) {
        const fila = document.createElement("div");
        fila.className = "producto";
        fila.innerHTML = `
          <span class="info">
            <span class="nombre">${p.nombre}</span>
            <span class="precio">$${p.precio.toLocaleString("es-CO")} / ${p.unidad_medida}</span>
          </span>
          <input type="number" min="1" value="1">
          <button>Agregar</button>
        `;
        const input = fila.querySelector("input");
        fila.querySelector("button").addEventListener("click", () => agregarAlCarrito(p, input));
        listado.appendChild(fila);
      }
    }

    if (data.productos.length === 0) {
      document.getElementById("estado").textContent = "No hay productos disponibles en este momento.";
    }
  }

  cargarCatalogo();
  cargarHistorial();
</script>
</body>
</html>
